<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa dos Locais · Área Selvagem 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .lista { display: flex; flex-direction: column; gap: 12px; }
    .item { display: flex; align-items: center; gap: 12px; }
    .num {
      flex: 0 0 38px; height: 38px; border-radius: 50%;
      background: #2878B8; color: #fff; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .info { flex: 1; }
    .info strong { display: block; color: #1B4F7C; line-height: 1.3; }
    .info small { color: #5B6B7D; }
    .ir {
      flex: 0 0 auto; padding: 10px 14px; border-radius: 10px;
      background: #2878B8; color: #fff; font-weight: bold;
      text-decoration: none; font-size: 0.9rem;
    }
    .voltar { text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">

    <header class="topo">
      <h1>Área Selvagem 2026</h1>
      <p class="subtitulo">Mapa dos locais</p>
    </header>

    <section class="cartao">
      <p>Visite pelo menos <strong>5 locais</strong> e escaneie o QR Code de cada um.</p>
      <div class="lista" id="lista"></div>
    </section>

    <p class="voltar"><a href="index.html" style="color:#fff;">← Voltar</a></p>

  </div>

  <script>
    const pontos = [
      { nome: "Campo Estrela – Estádio Sumaré", ref: "Sumaré", url: "https://maps.google.com/maps?cid=14729237033135411875" },
      { nome: "Palácio Bernardino Monteiro", ref: "Rua 25 de Março, 28 · Centro", url: "https://maps.google.com/maps?cid=11861475882114420101" },
      { nome: "Mercado Municipal", ref: "Rua Costa Pereira · Centro", url: "https://maps.google.com/maps?cid=788887476605232842" },
      { nome: "Praça Gilberto Machado", ref: "Centro", url: "https://maps.google.com/maps?cid=10382785781060185305" },
      { nome: "Praça Jerônimo Monteiro", ref: "Centro", url: "https://maps.google.com/maps?cid=6142652395555234654" },
      { nome: "Mural Luz del Fuego", ref: "Rua Rui Barbosa, 28 · Centro", url: "https://maps.google.com/maps?cid=16593790328841105902" },
      { nome: "Estação Ferroviária", ref: "Rua Cel. Francisco de Braga, 71 · Guandú", url: "https://maps.google.com/maps?cid=17843324858918207272" },
      { nome: "Teatro Rubem Braga", ref: "Av. Beira Rio · Guandú", url: "https://www.google.com/maps/search/?api=1&query=Teatro+Rubem+Braga+Avenida+Beira+Rio+Guandu+Cachoeiro+de+Itapemirim+ES" }
    ];

    document.getElementById("lista").innerHTML = pontos.map((p, i) => `
      <div class="item">
        <div class="num">${i + 1}</div>
        <div class="info">
          <strong>${p.nome}</strong>
          <small>${p.ref}</small>
        </div>
        <a class="ir" href="${p.url}" target="_blank" rel="noopener">Ver no mapa</a>
      </div>
    `).join("");
  </script>
</body>
</html>
